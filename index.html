<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Julio Camacho | Técnico Superior en Química Industrial</title>

  <style>
    :root {
      --azul: #102b46;
      --azul-medio: #1d4e78;
      --azul-claro: #eaf2f8;
      --blanco: #ffffff;
      --fondo: #f3f6f9;
      --texto: #263746;
      --gris: #647586;
      --borde: #dce5ec;
      --sombra: 0 8px 25px rgba(16, 43, 70, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.6;
      min-height: 100vh;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* CABECERA Y NAVEGACIÓN */

    header {
      background: var(--azul);
      color: var(--blanco);
      padding: 22px 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-button {
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      background: transparent;
      padding: 9px 18px;
      border-radius: 7px;
      transition: 0.2s;
    }

    .nav-button:hover,
    .nav-button.active {
      background: white;
      color: var(--azul);
    }

    /* CONTENIDO GENERAL */

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .page {
      display: none;
      animation: aparecer 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel {
      background: white;
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 35px;
      box-shadow: var(--sombra);
      margin-bottom: 24px;
    }

    h1,
    h2,
    h3 {
      color: var(--azul);
      line-height: 1.3;
    }

    h1 {
      font-size: clamp(27px, 4vw, 36px);
      margin-bottom: 10px;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--azul-medio);
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .muted {
      color: var(--gris);
    }

    /* PÁGINA PRINCIPAL */

    .hero {
      text-align: center;
      padding-top: 42px;
      padding-bottom: 42px;
    }

    .profile-photo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      border: 5px solid white;
      outline: 3px solid var(--azul-medio);
      box-shadow: var(--sombra);
      margin-bottom: 24px;
      background: var(--azul-claro);
    }

    .hero .subtitle {
      margin-top: 8px;
    }

    .hero-description {
      max-width: 650px;
      margin: 0 auto 24px;
      color: var(--gris);
    }

    .section-title {
      text-align: center;
      margin-bottom: 22px;
    }

    .about-text {
      max-width: 760px;
      margin: auto;
    }

    /* BOTONES */

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border: 1px solid var(--azul);
      border-radius: 8px;
      background: var(--azul);
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      background: var(--azul-medio);
      border-color: var(--azul-medio);
      transform: translateY(-1px);
    }

    .button.secondary {
      background: white;
      color: var(--azul);
    }

    .button.secondary:hover {
      background: var(--azul-claro);
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .back-button {
      margin-bottom: 20px;
    }

    /* TARJETAS DE DOCUMENTOS */

    .document-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

      background: white;

      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(16, 43, 70, 0.05);
